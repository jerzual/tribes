---
name: affected-build

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 26

permissions:
  pull-requests: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      nx_base: ${{ steps.set-shas.outputs.base }}
      nx_head: ${{ steps.set-shas.outputs.head }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup pnpm and node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
      - name: Set Nx SHAs
        id: set-shas
        uses: nrwl/nx-set-shas@v5
      - name: Cache Nx
        uses: actions/cache@v6
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

  format:
    needs: [setup]
    runs-on: ubuntu-latest
    env:
      NX_BASE: ${{ needs.setup.outputs.nx_base }}
      NX_HEAD: ${{ needs.setup.outputs.nx_head }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Restore Nx cache
        uses: actions/cache/restore@v6
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Setup pnpm and node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
      - name: Check formatting
        run: pnpm format:check

  lint:
    needs: [setup]
    runs-on: ubuntu-latest
    env:
      NX_BASE: ${{ needs.setup.outputs.nx_base }}
      NX_HEAD: ${{ needs.setup.outputs.nx_head }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Restore Nx cache
        uses: actions/cache/restore@v6
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Setup pnpm and node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
      - name: Lint affected projects
        run: pnpm exec nx affected -t lint --parallel=3

  test:
    needs: [setup]
    runs-on: ubuntu-latest
    env:
      NX_BASE: ${{ needs.setup.outputs.nx_base }}
      NX_HEAD: ${{ needs.setup.outputs.nx_head }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Restore Nx cache
        uses: actions/cache/restore@v6
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Setup pnpm and node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
      - name: Test affected projects
        run: pnpm exec nx affected -t test --parallel=3

  build:
    needs: [setup]
    runs-on: ubuntu-latest
    env:
      NX_BASE: ${{ needs.setup.outputs.nx_base }}
      NX_HEAD: ${{ needs.setup.outputs.nx_head }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Restore Nx cache
        uses: actions/cache/restore@v6
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Setup pnpm and node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
      - name: Build affected projects
        run: pnpm exec nx affected -t build --parallel=3

  results:
    if: always() && github.event_name == 'pull_request'
    needs: [format, lint, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Find existing comment
        uses: peter-evans/find-comment@v4
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- ci-build-results -->'
      - name: Build summary
        id: summary
        uses: actions/github-script@v9
        env:
          FORMAT_RESULT: ${{ needs.format.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        with:
          script: |
            const icon = (s) => s === 'success' ? ':white_check_mark:' : s === 'skipped' ? ':next_track_button:' : ':x:';
            const rows = [
              ['Format', process.env.FORMAT_RESULT],
              ['Lint',   process.env.LINT_RESULT],
              ['Test',   process.env.TEST_RESULT],
              ['Build',  process.env.BUILD_RESULT],
            ].map(([job, r]) => `| ${job} | ${icon(r)} ${r} |`).join('\n');
            const body = `<!-- ci-build-results -->\n## CI Results\n\n| Job | Status |\n|-----|--------|\n${rows}\n`;
            core.setOutput('body', body);
      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.summary.outputs.body }}
          edit-mode: replace
